<!DOCTYPE html>
<html lang="en-PK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin | MANIESTA LABEL</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@300;400;500;600&display=swap">
<link rel="stylesheet" href="assets/css/bootstrap.min.css">
<link rel="stylesheet" href="assets/css/fontawesome.min.css">
<link rel="stylesheet" href="assets/css/manieste.css">
<link rel="stylesheet" href="assets/css/manieste-pages.css">
<link rel="stylesheet" href="assets/css/manieste-states.css">
<link rel="shortcut icon" href="./assets/img/icons/icon-192.jpg" type="image/x-icon">
<style>
  /* Admin-only styles — not part of the storefront */
  body { background: #F7F5F1; }
  .mn-admin { display: grid; grid-template-columns: 1fr; min-height: 100vh; }
  @media (min-width: 992px) { .mn-admin { grid-template-columns: 240px 1fr; } }
  .mn-admin-nav {
    background: var(--mn-ink); color: var(--mn-bone);
    padding: 32px 24px; display: flex; flex-direction: column; gap: 24px;
  }
  @media (min-width: 992px) { .mn-admin-nav { min-height: 100vh; position: sticky; top: 0; } }
  .mn-admin-nav__title { font-size: 11px; letter-spacing: 0.22em; color: var(--mn-stone); margin: 0 0 8px; }
  .mn-admin-nav nav { display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .mn-admin-nav a {
    display: block; padding: 12px 14px; color: var(--mn-bone);
    font-size: 13px; letter-spacing: 0.06em; border-left: 2px solid transparent;
  }
  .mn-admin-nav a:hover { background: rgba(247,245,241,0.06); color: var(--mn-bone); }
  .mn-admin-nav a[aria-current="page"] { border-left-color: var(--mn-bone); background: rgba(247,245,241,0.08); }
  .mn-admin-nav__footer { padding-top: 24px; border-top: 1px solid rgba(247,245,241,0.15); }
  .mn-admin-main { padding: 48px 32px; max-width: 1200px; }
  @media (max-width: 640px) { .mn-admin-main { padding: 32px 20px; } }

  .mn-admin-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 48px; }
  .mn-admin-stat { padding: 20px; border: 1px solid var(--mn-hairline); background: var(--mn-chalk); }
  .mn-admin-stat__label { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--mn-stone); margin: 0 0 8px; }
  .mn-admin-stat__value { font-family: var(--mn-font-display); font-size: 1.75rem; font-weight: 500; margin: 0; color: var(--mn-ink); }

  .mn-admin-section { margin-bottom: 48px; }
  .mn-admin-section__title { font-family: var(--mn-font-body); font-size: 12px; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--mn-stone); margin: 0 0 20px; }
  .mn-admin-section__label { font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--mn-stone); margin: 0 0 10px; }

  .mn-admin-table-wrap { background: var(--mn-chalk); border: 1px solid var(--mn-hairline); overflow-x: auto; }
  .mn-admin-table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 640px; }
  .mn-admin-table th { text-align: left; padding: 14px 16px; font-size: 10px; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: var(--mn-stone); border-bottom: 1px solid var(--mn-hairline); background: #F7F5F1; }
  .mn-admin-table td { padding: 16px; border-bottom: 1px solid var(--mn-hairline); vertical-align: middle; }
  .mn-admin-table tr:last-child td { border-bottom: 0; }
  .mn-admin-table tr:hover { background: rgba(247,245,241,0.4); }
  .mn-admin-td-name { font-weight: 500; margin: 0; color: var(--mn-ink); }
  .mn-admin-td-meta { font-size: 11px; color: var(--mn-stone); margin: 2px 0 0; }
  .mn-admin-mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; letter-spacing: 0.04em; }

  .mn-admin-status { display: inline-block; padding: 3px 10px; font-size: 10px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; background: var(--mn-hairline); color: var(--mn-graphite); }
  .mn-admin-status[data-status="pending"]   { background: #FBF6F1; color: var(--mn-clay); }
  .mn-admin-status[data-status="confirmed"] { background: #EEF4FB; color: #3A4A6B; }
  .mn-admin-status[data-status="processing"]{ background: #EEF0FB; color: #4A3A6B; }
  .mn-admin-status[data-status="shipped"]   { background: #EEF0FB; color: #4A3A6B; }
  .mn-admin-status[data-status="delivered"] { background: #F0F9F1; color: var(--mn-signal); }
  .mn-admin-status[data-status="cancelled"] { background: #FBF1F1; color: var(--mn-error); }

  .mn-admin-btn { padding: 6px 14px; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; background: transparent; border: 1px solid var(--mn-hairline); color: var(--mn-ink); cursor: pointer; }
  .mn-admin-btn:hover { border-color: var(--mn-ink); }

  .mn-admin-filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  .mn-admin-filter { padding: 8px 14px; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; background: transparent; border: 1px solid var(--mn-hairline); color: var(--mn-graphite); cursor: pointer; }
  .mn-admin-filter:hover { color: var(--mn-ink); border-color: var(--mn-stone); }
  .mn-admin-filter.is-active { background: var(--mn-ink); color: var(--mn-bone); border-color: var(--mn-ink); }
  .mn-admin-filter__count { margin-left: 6px; opacity: 0.6; }

  .mn-admin-modal { position: fixed; inset: 0; z-index: 300; visibility: hidden; opacity: 0; transition: opacity 200ms ease; }
  .mn-admin-modal[aria-hidden="false"] { visibility: visible; opacity: 1; }
  .mn-admin-modal__scrim { position: absolute; inset: 0; background: rgba(14,14,14,0.55); }
  .mn-admin-modal__panel {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: var(--mn-bone); width: min(640px, 92vw); max-height: 90vh; overflow-y: auto;
    padding: 0;
  }
  .mn-admin-modal__close { position: absolute; top: 16px; right: 16px; width: 40px; height: 40px; background: transparent; border: 0; cursor: pointer; color: var(--mn-ink); z-index: 1; }
  .mn-admin-modal-header { padding: 28px 32px 20px; border-bottom: 1px solid var(--mn-hairline); display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; }
  .mn-admin-modal-date { font-size: 12px; color: var(--mn-stone); margin: 4px 0 0; }
  .mn-admin-modal-body { padding: 28px 32px; }
  .mn-admin-modal-section + .mn-admin-modal-section { margin-top: 28px; padding-top: 28px; border-top: 1px solid var(--mn-hairline); }
  .mn-admin-modal-line { font-size: 14px; color: var(--mn-graphite); margin: 0 0 4px; }
  .mn-admin-status-select { padding: 10px 14px; border: 1px solid var(--mn-hairline); background: var(--mn-chalk); font-size: 13px; text-transform: capitalize; color: var(--mn-ink); min-width: 160px; }

  @media (max-width: 991px) {
    .mn-admin-nav { padding: 20px 16px; flex-direction: row; align-items: center; gap: 16px; position: static; min-height: 0; }
    .mn-admin-nav__title { display: none; }
    .mn-admin-nav nav { flex-direction: row; gap: 8px; flex: 1; }
    .mn-admin-nav a { padding: 8px 12px; border-left: 0; border-bottom: 2px solid transparent; }
    .mn-admin-nav a[aria-current="page"] { border-left: 0; border-bottom-color: var(--mn-bone); }
    .mn-admin-nav__footer { padding: 0; border: 0; }
  }
</style>
</head>
<body>

<main data-admin-root>
  <div class="mn-loading-block" style="padding:120px 24px">
    <span class="mn-spinner"></span>
    <p>Loading admin…</p>
  </div>
</main>

<script type="module" src="./assets/js/firebase/products.js"></script>
<script type="module" src="./assets/js/firebase/storage.js"></script>
<script type="module" src="./assets/js/firebase/orders.js"></script>
<script type="module" src="./assets/js/firebase/admin-products.js"></script>
<script type="module" src="./assets/js/firebase/admin-users.js"></script>
<script type="module" src="./assets/js/firebase/user-tracking.js"></script>
<script type="module" src="./assets/js/firebase/admin.js"></script>
</body>
</html>
